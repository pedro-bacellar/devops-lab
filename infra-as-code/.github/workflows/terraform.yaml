name: Terraform CI/CD

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Execute Terraform apply?'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false

      plan_destroy:
        description: 'Execute Terraform plan destroy?'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false

      destroy:
        description: 'Execute Terraform destroy?'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false

permissions:
  id-token: write
  contents: read

jobs:
  job1:
    name: 'Terraform'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v6.2.2
        with:
          role-to-assume: arn:aws:iam::408336116697:role/github-infra-role
          aws-region: us-east-2

      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate
      
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        if: github.event.inputs.apply == 'true'

      - name: Terraform Plan Destroy
        run: terraform plan -destroy -out=tfplan.tfout
        if: github.event.inputs.plan_destroy == 'true'
      
      - name: Terraform Destroy
        run: terraform apply -destroy -auto-approve tfplan
        if: github.event.inputs.destroy == 'true'
